name: Build and Deploy

# A merge into develop deploys to the dev Container App; a merge into main
# deploys to prod. Each branch builds and deploys its own code independently
# (not a promoted artifact carried over from dev) - see
# notes/architecture-and-cicd.md for the reasoning.
on:
  push:
    branches:
      - main
      - develop

# id-token: write is required to request the short-lived GitHub OIDC token
# that azure/login exchanges for an Azure access token - see
# notes/federated-identity.md for how this avoids storing any Azure secret.
permissions:
  id-token: write
  contents: read

env:
  IMAGE: helloazure

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - name: Build and push image
        run: |
          IMAGE_TAG="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE }}:${{ github.run_number }}"
          docker build --build-arg BUILD_NUMBER=${{ github.run_number }} -t "$IMAGE_TAG" .
          docker push "$IMAGE_TAG"

      # main -> prod, develop -> dev. The federated credential trusts only
      # these two branch refs (notes/federated-identity.md), so this is the
      # only branching logic needed here.
      - name: Select target Container App
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "app=${{ vars.CONTAINERAPP_PROD_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "app=${{ vars.CONTAINERAPP_DEV_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install containerapp CLI extension
        run: az extension add --name containerapp --upgrade --only-show-errors

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ steps.target.outputs.app }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE }}:${{ github.run_number }}
